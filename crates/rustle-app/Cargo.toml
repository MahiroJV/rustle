[package]
name = "rustle-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustle"
path = "src/main.rs"

[dependencies]
rustle-core.workspace = true
rustle-fs.workspace = true
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
tokio = { version = "1", features = ["rt"] }
chrono = "0.4.45"
